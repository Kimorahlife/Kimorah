services:
  - type: web
    name: kimorah-server
    runtime: node
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Add your other env vars below as sync: false (secret) entries
      # - key: MONGO_URI
      #   sync: false
      # - key: JWT_SECRET
      #   sync: false
      # - key: ORIGIN_URL
      #   sync: false

services:
  - type: web
    name: kimorah-server
    runtime: node
    rootDir: server
    # --include=dev so the TypeScript compiler (a devDependency) is installed
    # for the build even though NODE_ENV=production would otherwise skip it.
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Add your other env vars below as sync: false (secret) entries
      # - key: MONGO_URI
      #   sync: false
      # - key: JWT_SECRET
      #   sync: false
      # - key: ORIGIN_URL
      #   sync: false
